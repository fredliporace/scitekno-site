# Página EO Datasets
eo_eyebrow: "OBSERVAÇÃO DA TERRA"
eo_title: "Datasets EO na AWS"
eo_tagline: "Imagens CBERS e Amazonia-1 na AWS"
eo_lead: "A SCITEKNO é parceira do programa Earth on AWS desde 2018, oferecendo acesso a imagens do CBERS-4, CBERS-4A e Amazonia-1 na AWS."
eo_text_1: "Nossos pipelines serverless transferem automaticamente cenas do CBERS-4, CBERS-4A e Amazonia-1 do <a href='https://www.dgi.inpe.br/catalogo/explore'>catálogo do INPE</a> e as convertem para GeoTIFFs Otimizados para Nuvem (COGs), desbloqueando todo o potencial dessas imagens para processamento e análise em larga escala na nuvem computacional."
eo_text_2: "Os COGs e arquivos de metadados são armazenados em um bucket S3 e disponibilizados ao público através do programa Earth on AWS."
eo_stat_1_number: "6.54M"
eo_stat_1_label: "Objetos S3"
eo_stat_2_number: "228T"
eo_stat_2_label: "Armazenamento"
eo_stat_3_number: "1.1M"
eo_stat_3_label: "Itens STAC"
eo_text_3: "Os recursos AWS são descritos no Registry of Open Data: <a href='https://registry.opendata.aws/cbers/'>CBERS</a> and <a href='https://registry.opendata.aws/amazonia/'>Amazonia-1</a>."
