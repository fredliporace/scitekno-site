{% assign t = site.data.locales[page.lang] | default: site.data.locales[site.default_lang] %}

<main>
  <div class="container py-5">
    <div class="eyebrow">{{ t.eo_eyebrow }}</div>
    <h1>{{ t.eo_title }}</h1>
    <p class="tagline">{{ t.eo_lead }}</p>
    <p class="lead">
      {{ t.eo_lead }}
    </p>
    <div class="status mt-4">
      <a href="mailto:contact@scitekno.com.br" class="btn btn-primary">{{ t.eo_cta_button }}</a>
    </div>
  </div>
</main>
