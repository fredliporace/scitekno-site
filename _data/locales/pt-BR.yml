experiment_eo_text_1: "Nossos pipelines transformam o downlink bruto em produtos prontos para análise, com qualidade radiométrica e geométrica validada para uso científico e operacional."
experiment_eo_text_2: "Os dados passam por fluxos de trabalho com qualidade avaliada antes da entrega, garantindo consistência para aplicações de séries temporais e detecção de mudanças."
