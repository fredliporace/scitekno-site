# EO Datasets page
eo_eyebrow: "EARTH OBSERVATION"
eo_title: "EO Datasets on AWS"
eo_tagline: "CBERS and Amazonia-1 imagery on AWS"
eo_lead: "SCITEKNO is a partner of the Earth on AWS program since 2018, providing access to CBERS-4, CBERS-4A and Amazonia-1 imagery on AWS."
eo_text_1: "Our serverless, scalable pipelines automatically transfer CBERS-4, CBERS-4A and Amazonia-1 scenes from <a href='https://www.dgi.inpe.br/catalogo/explore'>INPE's catalog</a> and convert them to Cloud Optimized GeoTIFFs (COGs), unlocking the full potential of these datasets for large-scale processing and analysis in the cloud."
eo_text_2: "The COGs and metadata files are stored in a S3 bucket and made available to the public through the Earth on AWS program."
eo_stat_1_number: "6.54M"
eo_stat_1_label: "Objects"
eo_stat_2_number: "228.66 T"
eo_stat_2_label: "Storage"
eo_text_3: "AWS resources are described in the Registry of Open Data: <a href='https://registry.opendata.aws/cbers/'>CBERS</a> and <a href='https://registry.opendata.aws/amazonia/'>Amazonia-1</a>."
