{% assign t = site.data.locales[page.lang] | default: site.data.locales[site.default_lang] %}

<main>
  <div class="container">
    <div class="eyebrow">{{ t.eyebrow_sub }}</div>

    <h1>SCITEKNO</h1>

    <p class="tagline">{{ t.tagline }}</p>

    <div class="orbit-wrap" aria-hidden="true">
      <svg viewBox="0 0 520 60">
        <path class="orbit-path" d="M 10,40 C 130,-10 390,-10 510,40"></path>
        <circle class="satellite satellite-anim" r="4"></circle>
      </svg>
    </div>

    <p class="lead">
      {{ t.lead }}
    </p>

    <div class="status">
      <!-- <span class="status-badge"><span class="dot"></span>{{ t.status_badge }}</span>
      <span>·</span> -->
    </div>

  </div>
</main>
